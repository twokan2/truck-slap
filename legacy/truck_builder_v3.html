<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Build & Crush Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a2233; --paper:#f6f9ff; --accent:#ff5d2e;
    --slot:#dbe7f5; --slotline:#8fb0d6; --gold:#ffd23f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    height:100dvh;display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .disp{font-family:'Luckiest Guy','Arial Rounded MT Bold',sans-serif;letter-spacing:.02em}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .screen.on{display:flex}

  /* ---------- NAME SCREEN ---------- */
  #nameScreen{background:
    radial-gradient(circle at 20% 15%, #ffe9a8 0 90px, transparent 90px),
    radial-gradient(circle at 85% 80%, #ffd0c0 0 70px, transparent 70px),
    linear-gradient(#dff0ff,#f6f9ff)}
  #nameScreen h1{font-size:clamp(32px,8.5vw,62px);color:var(--accent);text-shadow:0 4px 0 #00000018;line-height:1}
  #nameScreen h1 span{color:#2b6cb0}
  #nameScreen p{font-weight:900;margin:10px 0 22px;font-size:clamp(15px,4vw,20px)}
  #nameInput{
    font-family:'Nunito';font-weight:900;font-size:clamp(20px,6vw,30px);text-align:center;
    padding:14px 18px;border:4px solid var(--ink);border-radius:18px;width:min(360px,82vw);
    background:#fff;outline:none;box-shadow:0 6px 0 #00000020;
  }
  .bigBtn{
    margin-top:22px;font-family:'Luckiest Guy';font-size:clamp(22px,6vw,30px);color:#fff;
    background:linear-gradient(#ff7a47,#ff4d1c);border:4px solid var(--ink);border-radius:20px;
    padding:14px 34px;cursor:pointer;box-shadow:0 7px 0 #c93a10;transition:transform .08s;
  }
  .bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #c93a10}
  .heroTruck{width:min(400px,84vw);margin-bottom:6px;filter:drop-shadow(0 10px 14px #0002)}

  /* ---------- GARAGE ---------- */
  #garageScreen{background:linear-gradient(#dff0ff,#f6f9ff);justify-content:flex-start;padding-top:max(16px,env(safe-area-inset-top))}
  #garageScreen h2{font-size:clamp(24px,6.5vw,42px);color:#2b6cb0;text-shadow:0 3px 0 #00000014;margin-bottom:4px}
  #masterBadge{display:none;font-family:'Luckiest Guy';color:#b45309;background:linear-gradient(#ffe9a8,#ffd23f);border:4px solid var(--ink);border-radius:16px;padding:8px 18px;margin-bottom:8px;box-shadow:0 5px 0 #00000022;font-size:clamp(14px,4.2vw,21px)}
  #masterBadge.on{display:block}
  #tabs{display:flex;gap:10px;margin:6px 0 10px}
  .tab{
    font-family:'Luckiest Guy';font-size:clamp(16px,4.5vw,22px);padding:8px 20px;border:4px solid var(--ink);
    border-radius:16px;background:#fff;cursor:pointer;box-shadow:0 5px 0 #00000018;color:#7c8aa3;
  }
  .tab.on{background:linear-gradient(#ff7a47,#ff4d1c);color:#fff;box-shadow:0 5px 0 #c93a10}
  .tab.dino.on{background:linear-gradient(#5fd97c,#27ae46);box-shadow:0 5px 0 #1b7c31}
  #garageSub{font-weight:900;margin-bottom:12px;opacity:.8;font-size:clamp(12px,3.6vw,16px)}
  .truckGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:min(760px,94vw);overflow-y:auto;padding-bottom:24px;flex:1;align-content:start}
  .truckCard{
    background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 8px 10px;cursor:pointer;
    box-shadow:0 6px 0 #00000022;transition:transform .1s;position:relative;
  }
  .truckCard:active{transform:scale(.96)}
  .truckCard svg{width:100%;height:88px}
  .truckCard .tname{font-family:'Luckiest Guy';font-size:16px;margin-top:5px;color:var(--accent)}
  .truckCard .tsub{font-size:11.5px;font-weight:900;opacity:.65}
  .truckCard .stars{font-size:13px;letter-spacing:2px;min-height:17px}
  .truckCard .done{position:absolute;top:-10px;right:-8px;background:var(--gold);border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;display:none;align-items:center;justify-content:center;font-size:18px}
  .truckCard.built .done{display:flex}
  .truckCard.locked{background:#e7ecf4}
  .truckCard.locked svg{filter:grayscale(1) opacity(.28)}
  .truckCard.locked .tname{color:#94a3b8}
  .truckCard .lockIco{position:absolute;top:26px;left:0;right:0;font-size:34px;display:none}
  .truckCard.locked .lockIco{display:block}

  /* ---------- BUILD SCREEN ---------- */
  #buildScreen{display:none;flex-direction:column;height:100dvh}
  #buildScreen.on{display:flex}
  #buildHead{
    display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    background:#fff;border-bottom:4px solid var(--ink);z-index:5;
  }
  #backBtn,#muteBtn{font-size:18px;background:#eef4ff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;cursor:pointer;font-weight:900}
  #buildTitle{font-family:'Luckiest Guy';font-size:clamp(15px,4.2vw,23px);color:var(--accent);flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #timer{font-weight:900;font-size:14px;background:#fff7d6;border:3px solid var(--ink);border-radius:10px;padding:3px 8px;display:none}
  #timer.on{display:block}
  #progressWrap{flex:0 0 auto;width:min(140px,28vw);height:18px;border:3px solid var(--ink);border-radius:12px;background:#e6edf7;overflow:hidden}
  #progressBar{height:100%;width:0%;background:linear-gradient(90deg,#39c66d,#7ee08f);transition:width .35s}

  #stageWrap{flex:1;position:relative;min-height:0;
    background:
      linear-gradient(transparent 96%, #cfe2f7 96%) 0 0/28px 28px,
      linear-gradient(90deg, transparent 96%, #cfe2f7 96%) 0 0/28px 28px,
      linear-gradient(#eaf4ff,#f8fbff);
  }
  #stage{width:100%;height:100%;display:block;touch-action:none}
  .ghost path,.ghost rect,.ghost circle,.ghost polygon,.ghost ellipse,.ghost line{
    fill:var(--slot)!important;stroke:var(--slotline)!important;stroke-width:4!important;stroke-dasharray:9 7!important;
  }
  .ghost text{display:none}
  .ghost{opacity:.9}
  .placedPart{filter:drop-shadow(0 0 2.5px #ffffff) drop-shadow(0 0 2.5px #ffffff) drop-shadow(0 3px 3px #0003)}
  .popIn{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(1.45)}100%{transform:scale(1)}}

  #tray{
    background:#fff;border-top:4px solid var(--ink);padding:8px 8px max(8px,env(safe-area-inset-bottom));
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;
    min-height:96px;max-height:34dvh;overflow-y:auto;z-index:5;
  }
  .trayItem{
    width:72px;height:64px;background:#f2f7ff;border:3px solid var(--ink);border-radius:14px;
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;
    box-shadow:0 4px 0 #00000018;position:relative;
  }
  .trayItem svg{width:60px;height:46px;pointer-events:none}
  .trayItem.dragging{opacity:.25}
  .trayItem .lbl{position:absolute;bottom:-2px;left:0;right:0;font-size:8.5px;font-weight:900;opacity:.7;pointer-events:none}

  #dragGhost{position:fixed;left:0;top:0;pointer-events:none;z-index:80;filter:drop-shadow(0 8px 10px #0004);will-change:transform}
  #dragGhost.flyback{transition:transform .35s cubic-bezier(.3,.7,.4,1);opacity:0}

  /* ---------- FX ---------- */
  #fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:90}
  #cheerBanner{
    position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(0);z-index:95;pointer-events:none;
    font-family:'Luckiest Guy';color:#fff;text-align:center;line-height:1.05;
    text-shadow:0 3px 0 var(--ink), 0 0 22px #ffae00, 0 0 44px #ff5d2e;
    font-size:clamp(32px,8.5vw,70px);white-space:nowrap;
  }
  #cheerBanner .nm{display:block;color:var(--gold);font-size:clamp(38px,10.5vw,86px)}
  #cheerBanner.show{animation:cheer 1.5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes cheer{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}18%{transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.05)}}

  /* ---------- FINALE ---------- */
  #finale{position:fixed;inset:0;z-index:100;display:none;background:#0c1230;flex-direction:column}
  #finale.on{display:flex}
  #finaleStage{flex:1;width:100%;display:block}
  #finaleBanner{
    position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(0);text-align:center;
    font-family:'Luckiest Guy';color:#fff;line-height:1.02;pointer-events:none;
    text-shadow:0 4px 0 #000a, 0 0 28px #ffae00, 0 0 60px #ff5d2e;
    font-size:clamp(32px,8vw,76px);width:100%;
  }
  #finaleBanner .nm{display:block;color:var(--gold);font-size:clamp(42px,11.5vw,100px)}
  #finaleBanner.show{animation:fb .9s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes fb{to{transform:translate(-50%,-50%) scale(1)}}
  #finaleBtns{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:none;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 16px}
  #finaleBtns.show{display:flex}
  .spinwheel{animation:spin .18s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .shaking{animation:shake .09s linear infinite}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-2px)}50%{transform:translate(-1.5px,1px)}75%{transform:translate(1px,2px)}}
  .legA{animation:legA .42s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 8%}
  .legB{animation:legB .42s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 8%}
  @keyframes legA{from{transform:rotate(-11deg)}to{transform:rotate(12deg)}}
  @keyframes legB{from{transform:rotate(12deg)}to{transform:rotate(-11deg)}}
</style>
</head>
<body>

<!-- NAME -->
<div class="screen on" id="nameScreen">
  <svg class="heroTruck" viewBox="0 0 800 520" id="heroTruckSvg"></svg>
  <h1 class="disp">BUILD & CRUSH <span>GARAGE</span></h1>
  <p>Trucks! Dinosaurs! Type your name, builder!</p>
  <input id="nameInput" maxlength="14" placeholder="Your name" autocomplete="off">
  <button class="bigBtn" id="startBtn">LET'S BUILD! 🔧</button>
</div>

<!-- GARAGE -->
<div class="screen" id="garageScreen">
  <h2 class="disp" id="garageHello">PICK YOUR BUILD</h2>
  <div id="masterBadge">🏆 MASTER BUILDER 🏆</div>
  <div id="tabs">
    <button class="tab on" id="tabTruck">🚚 TRUCKS</button>
    <button class="tab dino" id="tabDino">🦖 DINOS</button>
  </div>
  <div id="garageSub">Drag the sticker parts to build it!</div>
  <div class="truckGrid" id="truckGrid"></div>
</div>

<!-- BUILD -->
<div id="buildScreen">
  <div id="buildHead">
    <button id="backBtn">←</button>
    <div id="buildTitle" class="disp"></div>
    <div id="timer">0:00</div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <button id="muteBtn">🔊</button>
  </div>
  <div id="stageWrap"><svg id="stage" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="tray"></div>
</div>

<!-- FX -->
<canvas id="fxCanvas"></canvas>
<div id="cheerBanner"></div>

<!-- FINALE -->
<div id="finale">
  <svg id="finaleStage" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="finaleBanner"></div>
  <div id="finaleBtns">
    <button class="bigBtn" id="againBtn" style="font-size:20px;padding:12px 22px">BUILD AGAIN 🔁</button>
    <button class="bigBtn" id="newTruckBtn" style="font-size:20px;padding:12px 22px;background:linear-gradient(#4aa3ff,#1f6fe0);box-shadow:0 7px 0 #14488f">GARAGE 🏠</button>
  </div>
</div>

<script>
/* ============================================================
   ART HELPERS
============================================================ */
const STK = 'stroke="#1a2233" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const STK3 = 'stroke="#1a2233" stroke-width="3.5" stroke-linejoin="round"';
function wheel(cx,cy,r,rim='#cdd6e3',style='lug'){
  const lugR=r*0.07, lugD=r*0.33;
  let lugs='';
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2;
    lugs+=`<circle cx="${(cx+Math.cos(a)*lugD).toFixed(1)}" cy="${(cy+Math.sin(a)*lugD).toFixed(1)}" r="${lugR.toFixed(1)}" fill="#5b6573"/>`;}
  let hub = style==='hex'
    ? `<polygon points="${hexPts(cx,cy,r*0.5)}" fill="${rim}" ${STK}/><circle cx="${cx}" cy="${cy}" r="${r*0.16}" fill="#5b6573" ${STK}/>`
    : `<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="${rim}" ${STK}/>${lugs}<circle cx="${cx}" cy="${cy}" r="${r*0.14}" fill="#8a93a3" ${STK}/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#222a38" ${STK}/>
  <circle cx="${cx}" cy="${cy}" r="${r*0.82}" fill="none" stroke="#0d1320" stroke-width="${r*0.16}" stroke-dasharray="${r*0.28} ${r*0.22}"/>
  ${hub}`;
}
function hexPts(cx,cy,r){let p=[];for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2;p.push(`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`)}return p.join(' ')}
function dinoEye(cx,cy,r=15){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" ${STK}/><circle cx="${cx+r*.3}" cy="${cy+r*.15}" r="${r*.45}" fill="#1a2233"/><circle cx="${cx+r*.42}" cy="${cy-r*.1}" r="${r*.16}" fill="#fff"/>`}
function dinoLeg(x,top,w,h,color,toe){
  return `<path d="M${x} ${top} Q${x+w} ${top-6} ${x+w+8} ${top+h*0.45} Q${x+w+10} ${top+h*0.8} ${x+w-6} ${top+h-8} L${x+w-2} ${top+h} L${x+4} ${top+h} Q${x-8} ${top+h*0.7} ${x+2} ${top+h*0.4} Z" fill="${color}" ${STK}/>
  <polygon points="${x+2},${top+h} ${x+12},${top+h-14} ${x+22},${top+h}" fill="${toe}" ${STK3}/>
  <polygon points="${x+24},${top+h} ${x+34},${top+h-14} ${x+44},${top+h}" fill="${toe}" ${STK3}/>`;
}

/* ============================================================
   BUILD DATA — viewBox 800x520, ground y≈472
   cat: 'truck' | 'dino'   lockedIf: 'trucks5' | 'dinos4'
============================================================ */
const TRUCKS = [
/* ================= TRUCKS ================= */
{
  id:'trail', cat:'truck', name:'TRAIL BOSS 4×4', sub:'Off-road legend', rearWheel:[225,400],
  parts:[
    {id:'frame', label:'Frame', svg:`<rect x="140" y="372" width="548" height="24" rx="10" fill="#2b2f3a" ${STK}/><rect x="200" y="392" width="50" height="12" rx="5" fill="#3a4150" ${STK}/><rect x="540" y="392" width="50" height="12" rx="5" fill="#3a4150" ${STK}/>`},
    {id:'body', label:'Body', svg:`<path d="M153 252 L590 252 L662 270 L684 322 L684 372 L637 372 A72 72 0 0 0 493 372 L297 372 A72 72 0 0 0 153 372 Z" fill="#f97316" ${STK}/><line x1="165" y1="300" x2="668" y2="300" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>`},
    {id:'hood', label:'Hood', svg:`<rect x="538" y="230" width="148" height="26" rx="9" fill="#ea580c" ${STK}/><circle cx="566" cy="243" r="5" fill="#7c2d12"/><circle cx="660" cy="243" r="5" fill="#7c2d12"/>`},
    {id:'grille', label:'Grille', svg:`<rect x="676" y="268" width="28" height="104" rx="9" fill="#374151" ${STK}/><line x1="690" y1="278" x2="690" y2="362" stroke="#6b7280" stroke-width="4"/><circle cx="690" cy="292" r="11" fill="#fef3c7" ${STK}/><circle cx="690" cy="348" r="8" fill="#fde68a" ${STK}/>`},
    {id:'bumperF', label:'Bumper', svg:`<rect x="666" y="358" width="62" height="24" rx="11" fill="#111827" ${STK}/><circle cx="722" cy="370" r="7" fill="#dc2626" ${STK}/>`},
    {id:'door', label:'Door', svg:`<rect x="330" y="262" width="132" height="102" rx="13" fill="#fb923c" ${STK}/><rect x="341" y="271" width="110" height="44" rx="9" fill="#bae6fd" ${STK}/><rect x="350" y="328" width="36" height="9" rx="4" fill="#7c2d12"/>`},
    {id:'roof', label:'Soft Top', svg:`<path d="M298 252 L322 170 Q331 156 352 156 L520 156 Q546 156 554 174 L578 252 Z" fill="#3f3f46" ${STK}/><line x1="350" y1="170" x2="338" y2="248" stroke="#27272a" stroke-width="4"/><line x1="470" y1="166" x2="478" y2="248" stroke="#27272a" stroke-width="4"/>`},
    {id:'spare', label:'Spare Tire', svg:`<circle cx="124" cy="306" r="48" fill="#222a38" ${STK}/><circle cx="124" cy="306" r="26" fill="#cdd6e3" ${STK}/><circle cx="124" cy="306" r="9" fill="#5b6573"/>`},
    {id:'wheelR', label:'Rear Wheel', svg: wheel(225,400,72)},
    {id:'wheelF', label:'Front Wheel', svg: wheel(565,400,72)},
  ]
},
{
  id:'mega', cat:'truck', name:'MEGA CRUSHER', sub:'Monster truck', rearWheel:[235,362],
  parts:[
    {id:'susp', label:'Suspension', svg:`<rect x="222" y="262" width="26" height="104" rx="8" fill="#475569" ${STK}/><rect x="572" y="262" width="26" height="104" rx="8" fill="#475569" ${STK}/><line x1="190" y1="276" x2="280" y2="340" stroke="#1a2233" stroke-width="10" stroke-linecap="round"/><line x1="540" y1="276" x2="630" y2="340" stroke="#1a2233" stroke-width="10" stroke-linecap="round"/><rect x="200" y="252" width="420" height="20" rx="9" fill="#334155" ${STK}/>`},
    {id:'body', label:'Body', svg:`<path d="M158 196 L406 196 L438 122 L562 122 L596 196 L668 196 L676 264 L150 264 Z" fill="#7c3aed" ${STK}/>`},
    {id:'flames', label:'Flame Decal', svg:`<path d="M158 262 L196 222 L214 252 L252 214 L268 250 L312 218 L326 254 L372 224 L384 262 Z" fill="#fb923c" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/><path d="M392 262 L424 230 L440 256 L478 228 L492 262 Z" fill="#fbbf24" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/>`},
    {id:'window', label:'Windows', svg:`<path d="M446 132 L554 132 L580 192 L420 192 Z" fill="#a5f3fc" ${STK}/><line x1="500" y1="134" x2="500" y2="190" stroke="#1a2233" stroke-width="5"/>`},
    {id:'pipes', label:'Exhaust Pipes', svg:`<rect x="396" y="92" width="20" height="106" rx="9" fill="#cbd5e1" ${STK}/><rect x="424" y="78" width="20" height="120" rx="9" fill="#cbd5e1" ${STK}/><ellipse cx="406" cy="92" rx="12" ry="7" fill="#64748b" ${STK}/><ellipse cx="434" cy="78" rx="12" ry="7" fill="#64748b" ${STK}/>`},
    {id:'lightbar', label:'Light Bar', svg:`<rect x="452" y="100" width="118" height="18" rx="8" fill="#1f2937" ${STK}/><circle cx="474" cy="109" r="7" fill="#fde047"/><circle cx="502" cy="109" r="7" fill="#fde047"/><circle cx="530" cy="109" r="7" fill="#fde047"/><circle cx="552" cy="109" r="7" fill="#fde047"/>`},
    {id:'guard', label:'Grille Guard', svg:`<rect x="660" y="208" width="22" height="64" rx="9" fill="#111827" ${STK}/><circle cx="671" cy="224" r="8" fill="#fef3c7" ${STK}/><circle cx="671" cy="252" r="8" fill="#fef3c7" ${STK}/>`},
    {id:'wheelR', label:'Mega Wheel', svg: wheel(235,362,110,'#fbbf24')},
    {id:'wheelF', label:'Mega Wheel', svg: wheel(585,362,110,'#fbbf24')},
  ]
},
{
  id:'volt', cat:'truck', name:'CYBER VOLT', sub:'Electric pickup', rearWheel:[230,410], flip:true,
  parts:[
    {id:'body', label:'Steel Body', svg:`<path d="M112 330 L388 176 L706 252 L706 388 L112 388 Z" fill="#cbd5e1" ${STK}/><line x1="388" y1="180" x2="392" y2="384" stroke="#94a3b8" stroke-width="4"/><line x1="540" y1="214" x2="540" y2="384" stroke="#94a3b8" stroke-width="4"/>`},

let muted=false, AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return AC; }
function tone(f1,f2,dur,type='sine',vol=.18,delay=0){
  if(muted)return; const ac=audio(); if(!ac)return;
  const t=ac.currentTime+delay;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
}
const sndPop=()=>{tone(520,180,.16,'square',.14)};
const sndYay=()=>{tone(420,840,.22,'triangle',.2); tone(560,1100,.25,'triangle',.18,.12)};
const sndBoom=()=>{tone(160,40,.5,'sawtooth',.16)};
const sndNope=()=>{tone(240,120,.22,'square',.1)};
const sndRev=()=>{tone(70,210,.9,'sawtooth',.22)};
const sndStomp=()=>{tone(95,32,.2,'sine',.3)};

function holdTone(type,f,dur,vol,wob){
  if(muted)return; const ac=audio(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.value=f;
  if(wob){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=wob;lg.gain.value=f*.06;l.connect(lg).connect(o.frequency);l.start();l.stop(ac.currentTime+dur);}
  g.gain.setValueAtTime(.001,ac.currentTime); g.gain.linearRampToValueAtTime(vol,ac.currentTime+.06);
  g.gain.setValueAtTime(vol,ac.currentTime+dur-.12); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
function sirenWail(dur){
  if(muted)return; const ac=audio(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle'; const t=ac.currentTime;
  for(let i=0;i<dur*2;i++){o.frequency.setValueAtTime(620,t+i*.5);o.frequency.linearRampToValueAtTime(930,t+i*.5+.25);o.frequency.linearRampToValueAtTime(620,t+i*.5+.5);}
  g.gain.setValueAtTime(.16,t); g.gain.setValueAtTime(.16,t+dur-.15); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(t+dur);
}
function roar(base=78,dur=1.5,vol=.26){
  if(muted)return; const ac=audio(); if(!ac)return;
  const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(base,t);
  o.frequency.linearRampToValueAtTime(base*1.5,t+dur*.3);
  o.frequency.exponentialRampToValueAtTime(base*.6,t+dur);
  const l=ac.createOscillator(),lg=ac.createGain(); l.frequency.value=15; lg.gain.value=base*.35;
  l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+dur);
  g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(vol,t+.08);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
  // breathy growl layer
  const n=ac.createBufferSource(); n.buffer=noiseBuf(ac,dur);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const ng=ac.createGain(); ng.gain.setValueAtTime(vol*.5,t); ng.gain.exponentialRampToValueAtTime(.001,t+dur);
  n.connect(lp).connect(ng).connect(ac.destination); n.start(t);
}
function jingle(){
  const notes=[523,659,784,1046,784,659,523,659,784];
  notes.forEach((f,i)=>tone(f,f,.16,'square',.12,i*.17));
}

/* ---------- finale music: heavy industrial stomp ---------- */
let music={on:false,timer:null,master:null};
function distCurve(k){const n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x));}return c;}
function noiseBuf(ac,dur){const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function startMusic(){
  const ac=audio(); if(!ac||music.on)return;
  music.on=true;
  const master=ac.createGain(); master.gain.value= muted?0:.55; master.connect(ac.destination);
  music.master=master;
  const sh=ac.createWaveShaper(); sh.curve=distCurve(90); sh.oversample='2x';
  const shG=ac.createGain(); shG.gain.value=.30; sh.connect(shG).connect(master);
  const bpm=104, eighth=60/bpm/2;
  const riff=[0,0,3,0,6,5,3,1, 0,0,3,0,8,6,5,3];
  function bar(t0){
    for(let i=0;i<16;i++){
      const t=t0+i*eighth, f=55*Math.pow(2,riff[i]/12);
      const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
      o.type='sawtooth';o.frequency.value=f; o2.type='square';o2.frequency.value=f/2;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.9,t+.012);
      g.gain.exponentialRampToValueAtTime(.02,t+eighth*.85);
      o.connect(g);o2.connect(g);g.connect(sh);
      o.start(t);o.stop(t+eighth);o2.start(t);o2.stop(t+eighth);
      if(i%4===0||i===10){const k=ac.createOscillator(),kg=ac.createGain();k.type='sine';
        k.frequency.setValueAtTime(130,t);k.frequency.exponentialRampToValueAtTime(38,t+.13);
        kg.gain.setValueAtTime(.8,t);kg.gain.exponentialRampToValueAtTime(.001,t+.16);
        k.connect(kg).connect(master);k.start(t);k.stop(t+.18);}
      if(i%4===2){const s=ac.createBufferSource();s.buffer=noiseBuf(ac,.15);
        const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.8;
        const sg=ac.createGain();sg.gain.setValueAtTime(.35,t);sg.gain.exponentialRampToValueAtTime(.001,t+.13);
        s.connect(bp).connect(sg).connect(master);s.start(t);}
      if(i%2===1){const h=ac.createBufferSource();h.buffer=noiseBuf(ac,.05);
        const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
        const hg=ac.createGain();hg.gain.setValueAtTime(.08,t);hg.gain.exponentialRampToValueAtTime(.001,t+.05);
        h.connect(hp).connect(hg).connect(master);h.start(t);}
    }
  }
  const barLen=16*eighth;
  let next=ac.currentTime+.05;
  bar(next); bar(next+barLen);
  next+=barLen*2;
  music.timer=setInterval(()=>{ if(!music.on)return; bar(next); bar(next+barLen); next+=barLen*2; },barLen*2000-120);
}
function stopMusic(){
  music.on=false;
  if(music.timer){clearInterval(music.timer);music.timer=null;}
  if(music.master){const m=music.master,ac=AC; try{m.gain.setValueAtTime(m.gain.value,ac.currentTime);m.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);}catch(e){} setTimeout(()=>{try{m.disconnect()}catch(e){}},500); music.master=null;}
}

function startBuild(truck){
  current=truck; placedCount=0;
  challengeMode=!!builtTrucks[truck.id];
  buildStart=Date.now();
  clearInterval(timerInt);
  const tm=$('timer');
  tm.classList.toggle('on',challengeMode);
  if(challengeMode){
    tm.textContent='0:00';
    timerInt=setInterval(()=>{const s=Math.floor((Date.now()-buildStart)/1000);

  }

  $('progressBar').style.width='0%';
  stage.innerHTML=''; tray.innerHTML='';
  const meas=document.createElementNS('http://www.w3.org/2000/svg','svg');
  meas.setAttribute('viewBox','0 0 800 520'); meas.style.cssText='position:fixed;left:-9999px;width:800px;height:520px';
  document.body.appendChild(meas);
  partBBoxes={};
  truck.parts.forEach(p=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML=p.svg; meas.appendChild(g);
    const b=g.getBBox(); partBBoxes[p.id]={x:b.x,y:b.y,w:b.width,h:b.height,cx:b.x+b.width/2,cy:b.y+b.height/2};
    meas.removeChild(g);
  });
  meas.remove();
  truck.parts.forEach(p=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','ghost'); g.dataset.part=p.id; g.innerHTML=p.svg;
    stage.appendChild(g);
  });
  const shuffled=[...truck.parts].sort(()=>Math.random()-.5);
  shuffled.forEach(p=>{
    const b=partBBoxes[p.id], pad=8;
    const item=document.createElement('div');
    item.className='trayItem'; item.dataset.part=p.id;
    item.innerHTML=`<svg viewBox="${b.x-pad} ${b.y-pad} ${b.w+pad*2} ${b.h+pad*2}" preserveAspectRatio="xMidYMid meet">${p.svg}</svg><div class="lbl">${p.label}</div>`;
    item.addEventListener('pointerdown',startDrag);
    tray.appendChild(item);
  });
  show('buildScreen');
}

/* ---------- DRAG ---------- */
let drag=null;
function stagePt(clientX,clientY){
  const pt=stage.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}
function startDrag(e){
  if(drag)return;
  const item=e.currentTarget, pid=item.dataset.part;
  const part=current.parts.find(p=>p.id===pid), b=partBBoxes[pid];
  e.preventDefault();
  const scale=stage.getBoundingClientRect().width/800;
  const w=Math.max(40,b.w*scale), h=Math.max(30,b.h*scale);
  const ghost=document.createElement('div');
  ghost.id='dragGhost';
  ghost.innerHTML=`<svg width="${w}" height="${h}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}">${part.svg}</svg>`;
  document.body.appendChild(ghost);
  item.classList.add('dragging');
  drag={pid,item,ghost,w,h,startRect:item.getBoundingClientRect()};
  moveGhost(e.clientX,e.clientY);
  window.addEventListener('pointermove',onDragMove,{passive:false});
  window.addEventListener('pointerup',onDragEnd);
  window.addEventListener('pointercancel',onDragEnd);
  sndPop();
}
function moveGhost(x,y){ drag.ghost.style.transform=`translate(${x-drag.w/2}px,${y-drag.h-14}px)`; drag.lastX=x; drag.lastY=y; }
function onDragMove(e){ e.preventDefault(); if(drag) moveGhost(e.clientX,e.clientY); }
function onDragEnd(e){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragEnd);
  window.removeEventListener('pointercancel',onDragEnd);
  if(!drag)return;
  const d=drag; drag=null;
  const px=d.lastX??e.clientX, py=(d.lastY??e.clientY)-(d.h/2+14);
  const p=stagePt(px,py);
  const b=partBBoxes[d.pid];
  const dist=Math.hypot(p.x-b.cx,p.y-b.cy);
  const threshold=Math.max(110, Math.max(b.w,b.h)*0.65);
  if(dist<threshold){
    d.ghost.remove(); d.item.remove();
    placePart(d.pid,px,py);
  }else{
    const onStage=document.elementFromPoint(px,d.lastY??e.clientY);
    if(onStage && $('stageWrap').contains(onStage)) sndNope();
    const r=d.startRect;
    d.ghost.classList.add('flyback');
    d.ghost.style.transform=`translate(${r.left}px,${r.top}px) scale(.4)`;
    setTimeout(()=>d.ghost.remove(),360);
    d.item.classList.remove('dragging');
  }
}
function placePart(pid,sx,sy){
  const part=current.parts.find(p=>p.id===pid);
  const ghost=stage.querySelector(`.ghost[data-part="${pid}"]`);
  if(ghost)ghost.remove();
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','placedPart popIn'); g.dataset.part=pid;
  g.style.transformBox='fill-box'; g.style.transformOrigin='center';
  g.innerHTML=part.svg;
  const order=current.parts.map(p=>p.id);
  const myIdx=order.indexOf(pid);
  let ref=null;
  for(const child of stage.querySelectorAll('.placedPart')){
    if(order.indexOf(child.dataset.part)>myIdx){ref=child;break;}
  }
  stage.insertBefore(g,ref);
  placedCount++;
  $('progressBar').style.width=(placedCount/current.parts.length*100)+'%';
  sndYay();
  if(sx!==undefined) burst(sx,sy,false);
  cheer();
  if(placedCount===current.parts.length){
    clearInterval(timerInt);
    const trucksWere=builtCount('truck'), dinosWere=builtCount('dino');
    builtTrucks[current.id]=true;
    justUnlockedMsg='';
    if(!current.lockedIf){
      if(current.cat==='truck'&&trucksWere<5&&builtCount('truck')>=5) justUnlockedMsg='🔓 2 SECRET TRUCKS UNLOCKED IN THE GARAGE!';
      if(current.cat==='dino'&&dinosWere<4&&builtCount('dino')>=4) justUnlockedMsg='🔓 SECRET DINO TRUCK UNLOCKED: REX RIDER!';
    }
    if(challengeMode){
      const secs=(Date.now()-buildStart)/1000, n=current.parts.length;
      const stars=secs<n*4.5?3:secs<n*8?2:1;
      bestStars[current.id]=Math.max(bestStars[current.id]||0,stars);
      current._lastStars=stars; current._lastSecs=Math.round(secs);
    } else { current._lastStars=0; }
    setTimeout(()=>runFinale(),1300);
  }
}

/* ============================================================
   FIREWORKS + CHEER
============================================================ */
const fx=$('fxCanvas'), fctx=fx.getContext('2d');
function sizeFx(){fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
sizeFx(); addEventListener('resize',sizeFx);
let particles=[], fxRunning=false;
const FCOLORS=['#ffd23f','#ff5d2e','#4aa3ff','#39c66d','#ff6bd6','#fff'];
function burst(x,y,big){
  sndBoom();
  const n=big?90:55, sp=big?7.5:5.5;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(0.3+Math.random())*sp;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.012+Math.random()*.012,
      c:FCOLORS[Math.floor(Math.random()*FCOLORS.length)],r:big?3.4:2.6});
  }
  if(!fxRunning){fxRunning=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.vx*=.985; p.vy*=.985; p.life-=p.decay;
    fctx.globalAlpha=Math.max(p.life,0);
    fctx.fillStyle=p.c;
    fctx.shadowColor=p.c; fctx.shadowBlur=10;
    fctx.beginPath(); fctx.arc(p.x,p.y,p.r*p.life+0.6,0,7); fctx.fill();
  }
  fctx.globalAlpha=1; fctx.shadowBlur=0;
  if(particles.length){requestAnimationFrame(fxLoop)}else{fxRunning=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}
const PRAISE=['BOOM!','PERFECT FIT!','AWESOME!','NAILED IT!','GREAT JOB!','WOW!','ROAR-SOME!'];
function cheer(){
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<3;i++){
    setTimeout(()=>burst(W*(0.15+Math.random()*0.7), H*(0.12+Math.random()*0.35), false), i*180);
  }
  const b=$('cheerBanner');
  b.innerHTML=`${PRAISE[Math.floor(Math.random()*PRAISE.length)]}<span class="nm">${playerName}!</span>`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

   FINALE — truck burnout / dino rampage
============================================================ */
const fin=$('finale'), fstage=$('finaleStage');
let finRAF=null;
function victimCar(){

    <g id="victimBody">

      <circle cx="164" cy="404" r="22" fill="#222a38" ${STK}/><circle cx="164" cy="404" r="10" fill="#cdd6e3"/>

}

function dinoScene(){
  const stars=Array.from({length:30},()=>`<circle cx="${Math.random()*1000}" cy="${Math.random()*240}" r="${1+Math.random()*1.5}" fill="#fff" opacity="${.3+Math.random()*.6}"/>`).join('');

    ${stars}

    <circle cx="214" cy="150" r="9" fill="#ffae00" opacity=".8"/><circle cx="232" cy="128" r="6" fill="#ffd23f" opacity=".7"/>
    <path d="M560 426 Q566 320 600 300 Q590 360 596 426 Z" fill="#1d2e1a"/>
    <path d="M600 304 Q560 280 540 292 Q572 296 598 312 Z M600 304 Q640 276 662 290 Q628 294 602 312 Z M600 304 Q596 262 612 248 Q606 282 604 310 Z" fill="#2f5d2a"/>
    <path d="M880 426 Q884 340 910 324 Q902 372 906 426 Z" fill="#1d2e1a"/>
    <path d="M910 328 Q878 308 862 318 Q888 322 908 334 Z M910 328 Q942 304 960 316 Q932 320 912 334 Z" fill="#2f5d2a"/>
    <rect y="426" width="1000" height="134" fill="#4a2e1d"/>
    <rect y="426" width="1000" height="8" fill="#2a1810"/>
    <ellipse cx="180" cy="470" rx="40" ry="9" fill="#3a2315"/><ellipse cx="480" cy="500" rx="56" ry="11" fill="#3a2315"/>`;
}
function runFinale(){
  fin.classList.add('on');
  $('finaleBanner').classList.remove('show');
  $('finaleBtns').classList.remove('show');
  const isDino = !current.parts.some(p=>/wheel/i.test(p.id));
  fstage.innerHTML=(isDino?dinoScene():truckScene())+victimCar()+`<g id="smokeLayer"></g><g id="finTruck"></g>`;
  const tg=fstage.querySelector('#finTruck');
  let legFlip=true;
  let inner=current.parts.map(p=>{
    if(/wheel/i.test(p.id)) return `<g class="fwheel">${p.svg}</g>`;
    if(/^leg/i.test(p.id)){ legFlip=!legFlip; return `<g class="fleg ${legFlip?'A':'B'}">${p.svg}</g>`; }
    return `<g>${p.svg}</g>`;
  }).join('');
  if(current.flip) inner=`<g transform="translate(800,0) scale(-1,1)">${inner}</g>`;
  const S=0.56, groundY=426;
  const baseY=groundY-472*S;
  tg.innerHTML=`<g id="truckInner" transform="translate(-520,${baseY}) scale(${S})">${inner}</g>`;
  const truckInner=fstage.querySelector('#truckInner');
  const smokeLayer=fstage.querySelector('#smokeLayer');
  const victim=fstage.querySelector('#victimBody');
  const rw=current.rearWheel;
  const rwx=current.flip? 800-rw[0] : rw[0];
  const smokeColor=isDino?'#caa97a':'#cfd6e4';

  let smoke=[];
  function spawnSmoke(tx,n,boost){
    for(let i=0;i<n;i++){
      smoke.push({x:tx+rwx*S+(Math.random()*40-20), y:baseY+rw[1]*S+24+(Math.random()*16-8),
        r:8+Math.random()*10, vx:-(1+Math.random()*2)*(boost?2:1), vy:-(0.4+Math.random()*1), life:1});
    }
  }
  function drawSmoke(){
    smokeLayer.innerHTML=smoke.map(s=>`<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${(s.r*(1.6-s.life)).toFixed(1)}" fill="${smokeColor}" opacity="${(s.life*.55).toFixed(2)}"/>`).join('');
  }
  function setLegs(on){
    fstage.querySelectorAll('.fleg').forEach(l=>{
      l.classList.toggle('legA',on&&l.classList.contains('A'));
      l.classList.toggle('legB',on&&l.classList.contains('B'));
    });
  }

  let t0=null, crushed=false, midDone=false, done=false, lastStomp=0;
  const carX=700, dur={enter:1200, mid:3200, charge:4800, out:5800};
  const voice=VSOUNDS[current.id]||sndRev;
  voice();
  if(isDino) setLegs(true);
  function frame(ts){
    if(!t0)t0=ts; const t=ts-t0;
    let x=-520, tilt=0, moving=false;
    if(t<dur.enter){ x=-520+(t/dur.enter)*640; moving=true; }
    else if(t<dur.mid){
      if(!midDone){midDone=true;
        if(isDino){ setLegs(false); truckInner.parentElement.classList.add('shaking'); roar(72,1.8,.3); setTimeout(()=>roar(80,1.2,.26),1100); }
        else { fstage.querySelectorAll('.fwheel').forEach(w=>w.classList.add('spinwheel')); truckInner.parentElement.classList.add('shaking'); voice(); setTimeout(voice,1100); }
      }
      if(isDino){ x=120; }
      else { x=120+((t-dur.enter)/(dur.mid-dur.enter))*50; if(Math.random()<.6) spawnSmoke(x,2,true); }
    }
    else if(t<dur.charge){
      if(truckInner.parentElement.classList.contains('shaking')){truckInner.parentElement.classList.remove('shaking'); if(isDino)setLegs(true);}
      const k=(t-dur.mid)/(dur.charge-dur.mid);
      x=(isDino?120:170)+k*k*900; moving=true;
      if(Math.random()<.4) spawnSmoke(x,1,!isDino);
      const frontX=x+700*S;
      if(frontX>carX+40 && frontX<carX+260){ tilt=isDino?-6:-9; if(!crushed){crushed=true; sndBoom(); if(isDino)roar(66,1.0,.3);
        victim.style.transformBox='fill-box'; victim.style.transformOrigin='center bottom';
        victim.style.transition='transform .25s cubic-bezier(.2,.9,.3,1)';
        victim.style.transform='scaleY(.3) scaleX(1.18)';
        burst(innerWidth*0.7, innerHeight*0.55, false);
      } }
    }
    else { x=(isDino?120:170)+900 + (t-dur.charge)*0.9; moving=true; }
    if(isDino && moving && t-lastStomp>330){ lastStomp=t; sndStomp(); }
    const bob=isDino&&moving? Math.sin(t/85)*7 : 0;
    truckInner.setAttribute('transform',`translate(${x.toFixed(1)},${(baseY+bob+(tilt?-14:0)).toFixed(1)}) scale(${S}) rotate(${tilt} 400 420)`);
    smoke=smoke.filter(s=>s.life>0);
    for(const s of smoke){s.x+=s.vx; s.y+=s.vy; s.life-=.016;}
    drawSmoke();
    if(t<dur.out){ finRAF=requestAnimationFrame(frame); }
    else if(!done){ done=true; megaCelebrate(isDino); }
  }
  finRAF=requestAnimationFrame(frame);
}
function megaCelebrate(isDino){
  startMusic();
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<14;i++){ setTimeout(()=>burst(W*(0.1+Math.random()*0.8), H*(0.1+Math.random()*0.45), true), i*230); }
  const b=$('finaleBanner');
  let extra='';
  if(current._lastStars){
    extra+=`<div style="font-size:clamp(26px,7vw,44px);margin-top:6px">${'⭐'.repeat(current._lastStars)}${'<span style="opacity:.25">⭐</span>'.repeat(3-current._lastStars)}</div>
    <div style="font-family:Nunito;font-weight:900;font-size:clamp(13px,3.5vw,18px);text-shadow:none;color:#ffe9c8">Time: ${current._lastSecs}s</div>`;
  }
  if(justUnlockedMsg){
    extra+=`<div style="font-family:Nunito;font-weight:900;font-size:clamp(15px,4.5vw,24px);margin-top:12px;color:#ffd23f;text-shadow:0 2px 0 #000a">${justUnlockedMsg}</div>`;
    for(let i=0;i<8;i++){ setTimeout(()=>burst(W*Math.random(), H*(0.5+Math.random()*0.3), true), 3200+i*200); }
    justUnlockedMsg='';
  }
  if(allDone()&&!current._lastStars){
    extra+=`<div style="font-family:Nunito;font-weight:900;font-size:clamp(15px,4.5vw,24px);margin-top:12px;color:#ffd23f;text-shadow:0 2px 0 #000a">🏆 MASTER BUILDER! EVERY BUILD COMPLETE!</div>`;
  }
  const verb=isDino?'STOMPED IT!':'CRUSHED IT!';
  b.innerHTML=`<span class="nm">${playerName}</span>${verb} 🏆<div style="font-family:Nunito;font-weight:900;font-size:clamp(14px,4vw,22px);text-shadow:none;margin-top:10px;color:#ffe9c8">${current.name} — COMPLETE!</div>${extra}`;
  b.classList.add('show');
  setTimeout(()=>$('finaleBtns').classList.add('show'),900);
  sndYay(); setTimeout(sndYay,500); setTimeout(sndYay,1100);
}
$('againBtn').onclick=()=>{cancelAnimationFrame(finRAF); stopMusic(); fin.classList.remove('on'); sndPop(); startBuild(current)};
$('newTruckBtn').onclick=()=>{cancelAnimationFrame(finRAF); stopMusic(); fin.classList.remove('on'); sndPop(); renderGarage(); show('garageScreen')};
$('backBtn').onclick=()=>{clearInterval(timerInt); sndPop(); renderGarage(); show('garageScreen')};
$('muteBtn').onclick=()=>{muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; if(music.master)music.master.gain.value=muted?0:.55;};
</script>
